<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Javascript 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Javascript Web Output #3</h1>

  <div class="button-row">
    <button type="button" id="loadBtn">Load data from the API</button>
    <button type="button" id="clearBtn">Clear Table</button>
  </div>

  <p class="api-line">API: <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank" rel="noopener">https://jsonplaceholder.typicode.com/todos/</a></p>

  <table id="todosTable">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Task ID</th>
        <th>Title</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="todosBody">
    </tbody>
  </table>

<script src="script.js"></script>
</body>
</html>
